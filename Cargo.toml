[package]
name = "gild-cli"
version = "0.2.1"
edition = "2024"
description = "A changelog tool that turns structured changefiles into releases"
license = "MIT"
repository = "https://github.com/el-dorado-ci/gild"
readme = "README.md"
keywords = ["changelog", "changeset", "release", "versioning", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gild"
path = "src/main.rs"

[package.metadata.gild]
artifact_name = "gild"

[package.metadata.gild.version_source]
type = "regex"
path = "Cargo.toml"
pattern = '^version = "(.+)"$'

[[package.metadata.gild.version_targets]]
type = "regex"
path = "Cargo.toml"
pattern = '^version = "(.+)"$'

[package.metadata.gild.queries]
major_changes = "contains([*bump_type], 'major')"
minor_changes = "contains([*bump_type], 'minor')"

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
dialoguer = "0.11"
rand = "0.10"
serde_yaml = "0.9"
jmespath = "0.5.0"
serde_json = "1.0.154"
colored = "3.1.1"

thiserror = "2.0.21"
regex = "1.13.1"
semver = "1.0.28"
