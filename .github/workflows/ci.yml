name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The hooks are `language: system`, so they run whatever cargo, rustfmt
      # and clippy the dev shell provides - the same versions used locally.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Entering the shell once runs the shellHook, which writes
      # .pre-commit-config.yaml - needed before it can be hashed below.
      - name: Enter the dev shell
        run: nix develop --command true

      - name: Cache cargo and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The clippy hook runs `cargo clippy --offline`, so the crates it
      # needs have to already be in ~/.cargo/registry before it runs.
      - name: Fetch dependencies
        run: nix develop --command cargo fetch

      - name: Run fmt and clippy
        run: nix develop --command pre-commit run --all-files

      - name: Run tests
        run: nix develop --command cargo test
